<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="640" viewBox="0 0 1200 640" font-family="'IPAPGothic','IPAGothic',sans-serif"><rect width="1200" height="640" fill="#ffffff"/><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#9aa3ae"/></marker><marker id="b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#2563eb"/></marker><marker id="g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#15803d"/></marker></defs><text x="40" y="46" font-size="22" fill="#1f2937" font-weight="700" text-anchor="start">恵那で学び、働き、育つ ― 進学しても地元を離れない人材の循環</text><rect x="120" y="90" width="340" height="120" rx="10" fill="#ffffff" stroke="#2563eb" stroke-width="2"/><text x="140" y="126" font-size="18" fill="#2563eb" font-weight="700" text-anchor="start">① 市内の高校生</text><text x="140" y="160" font-size="15" fill="#1f2937" font-weight="400" text-anchor="start">成果発表会や体験で</text><text x="140" y="186" font-size="15" fill="#1f2937" font-weight="400" text-anchor="start">「恵那でもできる」と知る</text><rect x="740" y="90" width="340" height="120" rx="10" fill="#ffffff" stroke="#2563eb" stroke-width="2"/><text x="760" y="126" font-size="18" fill="#2563eb" font-weight="700" text-anchor="start">② 恵那に住んだまま大学生に</text><text x="760" y="160" font-size="15" fill="#1f2937" font-weight="400" text-anchor="start">ZEN大学など通信制大学へ進学</text><text x="760" y="186" font-size="15" fill="#1f2937" font-weight="400" text-anchor="start">1年目は全国のZEN大学生から</text><rect x="740" y="420" width="340" height="120" rx="10" fill="#ffffff" stroke="#2563eb" stroke-width="2"/><text x="760" y="456" font-size="18" fill="#2563eb" font-weight="700" text-anchor="start">③ 市役所・地域・事業所で実践</text><text x="760" y="490" font-size="15" fill="#1f2937" font-weight="400" text-anchor="start">受託者に雇用された有償インターン</text><text x="760" y="516" font-size="15" fill="#1f2937" font-weight="400" text-anchor="start">学びながら課題を解く</text><rect x="120" y="420" width="340" height="120" rx="10" fill="#ffffff" stroke="#2563eb" stroke-width="2"/><text x="140" y="456" font-size="18" fill="#2563eb" font-weight="700" text-anchor="start">④ 地域で就職・活躍</text><text x="140" y="490" font-size="15" fill="#1f2937" font-weight="400" text-anchor="start">市役所・市内事業所・IT企業へ</text><text x="140" y="516" font-size="15" fill="#1f2937" font-weight="400" text-anchor="start">市内就業で奨学金の返還免除</text><path d="M462 150H738" fill="none" stroke="#2563eb" stroke-width="2.5" marker-end="url(#b)"/><text x="600" y="140" font-size="14" fill="#15803d" font-weight="700" text-anchor="middle">奨学金で進学を後押し</text><path d="M910 212V418" fill="none" stroke="#2563eb" stroke-width="2.5" marker-end="url(#b)"/><text x="922" y="320" font-size="14" fill="#2563eb" font-weight="700" text-anchor="start">有償インターン</text><path d="M738 480H462" fill="none" stroke="#2563eb" stroke-width="2.5" marker-end="url(#b)"/><text x="600" y="470" font-size="14" fill="#2563eb" font-weight="700" text-anchor="middle">卒業・就職</text><path d="M290 418V212" fill="none" stroke="#2563eb" stroke-width="2.5" marker-end="url(#b)"/><text x="278" y="320" font-size="14" fill="#2563eb" font-weight="700" text-anchor="end">次の世代の手本に</text><rect x="430" y="250" width="340" height="128" rx="10" fill="#1e3a8a" stroke="#1e3a8a" stroke-width="1.5"/><text x="600" y="292" font-size="20" fill="#ffffff" font-weight="700" text-anchor="middle">恵那で学び、働き、育つ</text><text x="600" y="326" font-size="14" fill="#dbe4ff" font-weight="400" text-anchor="middle">市職員も一緒に学び、</text><text x="600" y="348" font-size="14" fill="#dbe4ff" font-weight="400" text-anchor="middle">DXを続ける力が市役所に残る</text><rect x="40" y="572" width="1120" height="44" rx="10" fill="#f3f4f6" stroke="#f3f4f6" stroke-width="1.5"/><text x="600" y="600" font-size="15" fill="#1f2937" font-weight="400" text-anchor="middle">育てる相手：大学生・市職員・市内事業者・高校生　／　学生の作業は本番データを使わず、サンプルデータで行う</text></svg>