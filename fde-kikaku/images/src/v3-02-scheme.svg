<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="860" viewBox="0 0 1200 860" font-family="'IPAPGothic','IPAGothic',sans-serif"><rect width="1200" height="860" fill="#ffffff"/><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#9aa3ae"/></marker><marker id="b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#2563eb"/></marker><marker id="g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#15803d"/></marker></defs><text x="40" y="46" font-size="22" fill="#1f2937" font-weight="700" text-anchor="start">契約とお金は市から事業者へ直接。協議会は「決める・評価する場」として支える</text><rect x="420" y="76" width="360" height="70" rx="10" fill="#ffffff" stroke="#9aa3ae" stroke-width="1.5"/><text x="600" y="105" font-size="18" fill="#1f2937" font-weight="700" text-anchor="middle">国（内閣府）</text><text x="600" y="131" font-size="14" fill="#5b6472" font-weight="400" text-anchor="middle">地域未来交付金（地域未来推進型）</text><path d="M600 148V204" fill="none" stroke="#9aa3ae" stroke-width="2" marker-end="url(#a)"/><text x="612" y="182" font-size="14" fill="#5b6472" font-weight="400" text-anchor="start">交付金（事業費の1/2）</text><rect x="420" y="206" width="360" height="78" rx="10" fill="#ffffff" stroke="#9aa3ae" stroke-width="1.5"/><text x="600" y="236" font-size="18" fill="#1f2937" font-weight="700" text-anchor="middle">恵那市（申請・事業の主体）</text><text x="600" y="264" font-size="14" fill="#5b6472" font-weight="400" text-anchor="middle">実践の場・予算・地域再生計画</text><rect x="40" y="206" width="260" height="78" rx="10" fill="#e7f6ec" stroke="#15803d" stroke-width="1.5"/><text x="170" y="236" font-size="16" fill="#15803d" font-weight="700" text-anchor="middle">地域DX人材育成奨学金</text><text x="170" y="262" font-size="14" fill="#1f2937" font-weight="400" text-anchor="middle">市単独（交付金の対象外）</text><path d="M418 245H302" fill="none" stroke="#9aa3ae" stroke-width="2" marker-end="url(#a)"/><rect x="40" y="350" width="260" height="86" rx="10" fill="#ffffff" stroke="#9aa3ae" stroke-width="1.5"/><text x="170" y="382" font-size="17" fill="#1f2937" font-weight="700" text-anchor="middle">市内の高校生</text><text x="170" y="408" font-size="14" fill="#5b6472" font-weight="400" text-anchor="middle">発表会・体験で事業に関わる</text><path d="M170 286V348" fill="none" stroke="#15803d" stroke-width="2" marker-end="url(#g)"/><text x="180" y="324" font-size="13" fill="#15803d" font-weight="400" text-anchor="start">進学を支援</text><rect x="420" y="340" width="360" height="122" rx="10" fill="#e8f0fe" stroke="#2563eb" stroke-width="2.5"/><text x="600" y="372" font-size="18" fill="#1f2937" font-weight="700" text-anchor="middle">受託者（単一事業者 または 共同企業体）</text><text x="600" y="400" font-size="14" fill="#1f2937" font-weight="400" text-anchor="middle">事業の実施・技術指導・成果への責任</text><text x="600" y="424" font-size="14" fill="#1f2937" font-weight="400" text-anchor="middle">学生の雇用と労務管理・市内に拠点</text><text x="600" y="448" font-size="14" fill="#1f2937" font-weight="400" text-anchor="middle">地元IT事業者へ再委託・協業</text><path d="M600 286V338" fill="none" stroke="#2563eb" stroke-width="2.5" marker-end="url(#b)"/><text x="612" y="318" font-size="14" fill="#2563eb" font-weight="700" text-anchor="start">業務委託（学生の人件費を含む）</text><rect x="900" y="340" width="260" height="120" rx="10" fill="#ffffff" stroke="#9aa3ae" stroke-width="1.5"/><text x="1030" y="368" font-size="18" fill="#1f2937" font-weight="700" text-anchor="middle">ZEN大学</text><text x="1030" y="392" font-size="14" fill="#5b6472" font-weight="400" text-anchor="middle">学生への周知・選考の協力</text><text x="1030" y="414" font-size="14" fill="#5b6472" font-weight="400" text-anchor="middle">学びとキャリアの見守り</text><text x="1030" y="440" font-size="13" fill="#5b6472" font-weight="400" text-anchor="middle">他の大学・高専にも開く</text><path d="M780 245H1030V338" fill="none" stroke="#1e3a8a" stroke-width="1.5" stroke-dasharray="6 5"/><path d="M782 394H898" fill="none" stroke="#1e3a8a" stroke-width="1.5" stroke-dasharray="6 5"/><text x="840" y="234" font-size="13" fill="#1e3a8a" font-weight="700" text-anchor="start">3者協定（役割・学生の保護・成果の扱い）</text><text x="790" y="386" font-size="13" fill="#1e3a8a" font-weight="400" text-anchor="start">覚書</text><rect x="420" y="506" width="360" height="78" rx="10" fill="#ffffff" stroke="#2563eb" stroke-width="1.5"/><text x="600" y="536" font-size="18" fill="#1f2937" font-weight="700" text-anchor="middle">学生（有償インターン）</text><text x="600" y="562" font-size="14" fill="#5b6472" font-weight="400" text-anchor="middle">勤務時間は学業を優先して大学と相談</text><path d="M600 464V504" fill="none" stroke="#2563eb" stroke-width="2" marker-end="url(#b)"/><text x="612" y="488" font-size="14" fill="#2563eb" font-weight="400" text-anchor="start">雇用・賃金・指導</text><path d="M1030 462V545H782" fill="none" stroke="#9aa3ae" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#a)"/><text x="1040" y="520" font-size="13" fill="#5b6472" font-weight="400" text-anchor="start">在学（学費は本人負担）</text><path d="M302 393H360V545H418" fill="none" stroke="#9aa3ae" stroke-width="2" marker-end="url(#a)"/><text x="312" y="470" font-size="13" fill="#5b6472" font-weight="400" text-anchor="start">進学</text><rect x="40" y="506" width="260" height="78" rx="10" fill="#ffffff" stroke="#9aa3ae" stroke-width="1.5"/><text x="170" y="536" font-size="17" fill="#1f2937" font-weight="700" text-anchor="middle">市職員（育成の対象）</text><text x="170" y="562" font-size="14" fill="#5b6472" font-weight="400" text-anchor="middle">自分の課の業務を一緒に改善</text><path d="M170 586V622M600 586V622M170 622H990" fill="none" stroke="#9aa3ae" stroke-width="2"/><path d="M210 622V652" fill="none" stroke="#9aa3ae" stroke-width="2" marker-end="url(#a)"/><path d="M600 622V652" fill="none" stroke="#9aa3ae" stroke-width="2" marker-end="url(#a)"/><path d="M990 622V652" fill="none" stroke="#9aa3ae" stroke-width="2" marker-end="url(#a)"/><text x="612" y="612" font-size="13" fill="#5b6472" font-weight="400" text-anchor="start">一緒に現場に入る</text><rect x="40" y="654" width="360" height="66" rx="10" fill="#ffffff" stroke="#9aa3ae" stroke-width="1.5"/><text x="60" y="682" font-size="17" fill="#1f2937" font-weight="700" text-anchor="start">① 市役所の業務</text><text x="60" y="706" font-size="14" fill="#5b6472" font-weight="400" text-anchor="start">庁内の改善テーマ</text><rect x="420" y="654" width="360" height="66" rx="10" fill="#ffffff" stroke="#9aa3ae" stroke-width="1.5"/><text x="440" y="682" font-size="17" fill="#1f2937" font-weight="700" text-anchor="start">② 市民の暮らし</text><text x="440" y="706" font-size="14" fill="#5b6472" font-weight="400" text-anchor="start">住民に届く実証テーマ</text><rect x="800" y="654" width="360" height="66" rx="10" fill="#ffffff" stroke="#9aa3ae" stroke-width="1.5"/><text x="820" y="682" font-size="17" fill="#1f2937" font-weight="700" text-anchor="start">③ 市内事業所</text><text x="820" y="706" font-size="14" fill="#5b6472" font-weight="400" text-anchor="start">相談会・業務診断・導入支援</text><rect x="40" y="742" width="1120" height="56" rx="10" fill="#f3f4f6" stroke="#f3f4f6" stroke-width="1.5"/><text x="600" y="768" font-size="16" fill="#1f2937" font-weight="700" text-anchor="middle">地域の協議会（1年目に設置・お金は通さない）：市・経済団体・金融機関・大学・高校・開発事業者</text><text x="600" y="790" font-size="14" fill="#5b6472" font-weight="400" text-anchor="middle">テーマと支援先の選定、成果の評価、オープンソースの方針、会員制度（詳しくは協議会の図）</text><text x="40" y="836" font-size="13" fill="#5b6472" font-weight="400" text-anchor="start">注：2年目に法人化（一般社団法人等）を判断し、共同利用・有料支援の契約主体とする。地域活性化起業人など他の制度とは経費・時間を区分する。</text></svg>