<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" font-family="'IPAPGothic','IPAGothic',sans-serif"><rect width="1200" height="760" fill="#ffffff"/><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#9aa3ae"/></marker><marker id="b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#2563eb"/></marker><marker id="g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#15803d"/></marker></defs><text x="40" y="46" font-size="22" fill="#1f2937" font-weight="700" text-anchor="start">協議会は「ルールを決めて、つなぐ場」。権利は市、作業とサービスは事業者・法人が担う</text><rect x="40" y="80" width="340" height="250" rx="10" fill="#ffffff" stroke="#9aa3ae" stroke-width="1.5"/><text x="60" y="112" font-size="18" fill="#1f2937" font-weight="700" text-anchor="start">恵那市</text><text x="60" y="138" font-size="15" fill="#5b6472" font-weight="700" text-anchor="start">権利を持つ</text><line x1="60" y1="152" x2="360" y2="152" stroke="#9aa3ae" stroke-width="1"/><text x="60" y="182" font-size="14" fill="#1f2937" font-weight="400" text-anchor="start">・成果物の著作権を保有（委託契約で帰属）</text><text x="60" y="212" font-size="14" fill="#1f2937" font-weight="400" text-anchor="start">・公開場所（GitHub等）の所有者</text><text x="60" y="242" font-size="14" fill="#1f2937" font-weight="400" text-anchor="start">・受託者へ開発・保守を委託</text><text x="60" y="272" font-size="14" fill="#1f2937" font-weight="400" text-anchor="start">・他自治体と共同利用の協定を結ぶ</text><rect x="430" y="80" width="340" height="250" rx="10" fill="#e8f0fe" stroke="#2563eb" stroke-width="2"/><text x="450" y="112" font-size="18" fill="#1f2937" font-weight="700" text-anchor="start">地域の協議会</text><text x="450" y="138" font-size="15" fill="#2563eb" font-weight="700" text-anchor="start">ルールを決める</text><line x1="450" y1="152" x2="750" y2="152" stroke="#9aa3ae" stroke-width="1"/><text x="450" y="182" font-size="14" fill="#1f2937" font-weight="400" text-anchor="start">・公開方針・ライセンス・公開前の確認</text><text x="450" y="212" font-size="14" fill="#1f2937" font-weight="400" text-anchor="start">・改善の優先順位・要望の集約</text><text x="450" y="242" font-size="14" fill="#1f2937" font-weight="400" text-anchor="start">・テーマ・支援先の選定と成果の評価</text><text x="450" y="272" font-size="14" fill="#1f2937" font-weight="400" text-anchor="start">・会員制度・開発パートナーの登録基準</text><text x="450" y="312" font-size="13" fill="#2563eb" font-weight="700" text-anchor="start">お金は通さない・著作権は持たない</text><rect x="820" y="80" width="340" height="250" rx="10" fill="#ffffff" stroke="#9aa3ae" stroke-width="1.5"/><text x="840" y="112" font-size="18" fill="#1f2937" font-weight="700" text-anchor="start">受託者 → 法人・開発パートナー</text><text x="840" y="138" font-size="15" fill="#5b6472" font-weight="700" text-anchor="start">作業とサービス</text><line x1="840" y1="152" x2="1140" y2="152" stroke="#9aa3ae" stroke-width="1"/><text x="840" y="182" font-size="14" fill="#1f2937" font-weight="400" text-anchor="start">・開発・保守・公開作業（1年目は受託者）</text><text x="840" y="212" font-size="14" fill="#1f2937" font-weight="400" text-anchor="start">・導入支援・個別開発（開発パートナー）</text><text x="840" y="242" font-size="14" fill="#1f2937" font-weight="400" text-anchor="start">・共同利用・有料サービス（法人化後）</text><text x="840" y="272" font-size="14" fill="#1f2937" font-weight="400" text-anchor="start">・預かるデータの管理責任を負う</text><path d="M428 205H384" fill="none" stroke="#9aa3ae" stroke-width="2" marker-end="url(#a)"/><text x="406" y="196" font-size="13" fill="#5b6472" font-weight="400" text-anchor="middle">提言</text><path d="M772 205H816" fill="none" stroke="#9aa3ae" stroke-width="2" marker-end="url(#a)"/><text x="794" y="196" font-size="13" fill="#5b6472" font-weight="400" text-anchor="middle">基準</text><path d="M210 332V356H990V334" fill="none" stroke="#9aa3ae" stroke-width="2" marker-end="url(#a)"/><text x="600" y="350" font-size="13" fill="#5b6472" font-weight="400" text-anchor="middle">委託（開発・保守）　契約とお金は市から直接</text><rect x="40" y="392" width="840" height="256" rx="10" fill="#f3f4f6" stroke="#f3f4f6" stroke-width="1.5"/><text x="60" y="424" font-size="18" fill="#1f2937" font-weight="700" text-anchor="start">協議会の会員</text><rect x="60" y="442" width="256" height="186" rx="10" fill="#ffffff" stroke="#2563eb" stroke-width="1.5"/><text x="76" y="472" font-size="16" fill="#2563eb" font-weight="700" text-anchor="start">運営会員</text><text x="76" y="504" font-size="14" fill="#1f2937" font-weight="400" text-anchor="start">市・経済団体・地域金融機関</text><text x="76" y="528" font-size="14" fill="#1f2937" font-weight="400" text-anchor="start">大学・高校</text><text x="76" y="576" font-size="14" fill="#1f2937" font-weight="700" text-anchor="start">→ 方針・優先順位・評価を決める</text><rect x="330" y="442" width="256" height="186" rx="10" fill="#ffffff" stroke="#2563eb" stroke-width="1.5"/><text x="346" y="472" font-size="16" fill="#2563eb" font-weight="700" text-anchor="start">開発パートナー（登録制）</text><text x="346" y="504" font-size="14" fill="#1f2937" font-weight="400" text-anchor="start">受託者・地元IT事業者など</text><text x="346" y="528" font-size="14" fill="#1f2937" font-weight="400" text-anchor="start">条件を公開した開放型の登録</text><text x="346" y="576" font-size="14" fill="#1f2937" font-weight="700" text-anchor="start">→ 導入・保守・個別開発を請け負う</text><rect x="600" y="442" width="256" height="186" rx="10" fill="#ffffff" stroke="#2563eb" stroke-width="1.5"/><text x="616" y="472" font-size="16" fill="#2563eb" font-weight="700" text-anchor="start">利用会員</text><text x="616" y="504" font-size="14" fill="#1f2937" font-weight="400" text-anchor="start">市内事業所・団体・自治会</text><text x="616" y="528" font-size="14" fill="#1f2937" font-weight="400" text-anchor="start">1年目は無料</text><text x="616" y="576" font-size="14" fill="#1f2937" font-weight="700" text-anchor="start">→ 要望・研修・事例共有・相談</text><path d="M428 334V390" fill="none" stroke="#2563eb" stroke-width="2" marker-end="url(#b)"/><rect x="910" y="392" width="250" height="256" rx="10" fill="#ffffff" stroke="#9aa3ae" stroke-width="1.5" stroke-dasharray="6 5"/><text x="930" y="424" font-size="18" fill="#1f2937" font-weight="700" text-anchor="start">他の自治体</text><text x="930" y="462" font-size="14" fill="#5b6472" font-weight="400" text-anchor="start">協議会の会員ではなく</text><text x="930" y="488" font-size="14" fill="#5b6472" font-weight="400" text-anchor="start">市との協定で関わる</text><text x="930" y="514" font-size="14" fill="#5b6472" font-weight="400" text-anchor="start"></text><text x="930" y="540" font-size="14" fill="#5b6472" font-weight="400" text-anchor="start">共同利用・費用分担は</text><text x="930" y="566" font-size="14" fill="#5b6472" font-weight="400" text-anchor="start">自治体どうしの協定や</text><text x="930" y="592" font-size="14" fill="#5b6472" font-weight="400" text-anchor="start">負担金で整理する</text><rect x="40" y="672" width="1120" height="64" rx="10" fill="#e7f6ec" stroke="#e7f6ec" stroke-width="1.5"/><text x="60" y="699" font-size="15" fill="#1f2937" font-weight="700" text-anchor="start">オープンソースは会員でなくても誰でも使える。会員の特典はコードではなく「支援とつながり」。</text><text x="60" y="724" font-size="14" fill="#5b6472" font-weight="400" text-anchor="start">運営会員と開発パートナーを兼ねる事業者は、関係する議決から外れる。有料サービスの契約主体は法人化後の法人とする。</text></svg>