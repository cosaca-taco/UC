="14" fill="#1e3a8a" font-weight="700" text-anchor="middle">1年目の成果評価</text><path d="M758 611l11 11l-11 11l-11 -11z" fill="#ffffff" stroke="#1e3a8a" stroke-width="2"/><text x="758" y="658" font-size="14" fill="#1e3a8a" font-weight="700" text-anchor="middle">2年目の評価・法人化判断</text><path d="M956 611l11 11l-11 11l-11 -11z" fill="#ffffff" stroke="#1e3a8a" stroke-width="2"/><text x="956" y="658" font-size="14" fill="#1e3a8a" font-weight="700" text-anchor="middle">自走への移行判断</text><text x="40" y="702" font-size="13" fill="#5b6472" font-weight="400" text-anchor="start">各年度の事業は、毎年度の予算議決と交付決定が前提。不採択・減額の場合は「育成＋1テーマ＋相談会」の最小構成（年約2,000万円）で実施するか見送るかを事前に決める。</text></svg>