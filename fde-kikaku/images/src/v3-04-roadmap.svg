 width="190" height="86" rx="8" fill="#ffffff" stroke="#9aa3ae" stroke-width="1"/><text x="774" y="286" font-size="14" fill="#1f2937" font-weight="400" text-anchor="start">市内の高校生が</text><text x="774" y="310" font-size="14" fill="#1f2937" font-weight="400" text-anchor="start">入学して参加する流れ</text><rect x="960" y="260" width="190" height="86" rx="8" fill="#ffffff" stroke="#9aa3ae" stroke-width="1"/><text x="972" y="286" font-size="14" fill="#1f2937" font-weight="400" text-anchor="start">育った人が</text><text x="972" y="310" font-size="14" fill="#1f2937" font-weight="400" text-anchor="start">次の世代を指導</text><rect x="40" y="354" width="120" height="70" rx="8" fill="#f3f4f6" stroke="#f3f4f6" stroke-width="1.5"/><text x="100" y="395.0" font-size="16" fill="#1f2937" font-weight="700" text-anchor="middle">事業所支援</text><rect x="168" y="354" width="190" height="70" rx="8" fill="#e8f0fe" stroke="#9aa3ae" stroke-width="1"/><text x="180" y="380" font-size="14" fill="#1f2937" font-weight="400" text-anchor="start">協議会の構成を</text><text x="180" y="404" font-size="14" fill="#1f2937" font-weight="400" text-anchor="start">決める</text><rect x="366" y="354" width="190" height="70" rx="8" fill="#ffffff" stroke="#9aa3ae" stroke-width="1"/><text x="378" y="380" font-size="14" fill="#1f2937" font-weight="400" text-anchor="start">相談会・業務診断</text><text x="378" y="404" font-size="14" fill="#1f2937" font-weight="400" text-anchor="start">3〜5社</text><rect x="564" y="354" width="190" height="70" rx="8" fill="#ffffff" stroke="#9aa3ae" stroke-width="1"/><text x="576" y="380" font-size="14" fill="#1f2937" font-weight="400" text-anchor="start">業務診断10社程度</text><text x="576" y="404" font-size="14" fill="#1f2937" font-weight="400" text-anchor="start">導入支援</text><rect x="762" y="354" width="190" height="70" rx="8" fill="#ffffff" stroke="#9aa3ae" stroke-width="1"/><text x="774" y="380" font-size="14" fill="#1f2937" font-weight="400" text-anchor="start">有料メニュー化</text><text x="774" y="404" font-size="14" fill="#1f2937" font