<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="850" viewBox="0 0 1200 850" font-family="'IPAPGothic','IPAGothic',sans-serif"><rect width="1200" height="850" fill="#ffffff"/><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#9aa3ae"/></marker><marker id="b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#2563eb"/></marker><marker id="g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#15803d"/></marker></defs><rect x="0" y="0" width="1200" height="104" rx="0" fill="#1e3a8a" stroke="#1e3a8a" stroke-width="1.5"/><text x="40" y="50" font-size="30" fill="#ffffff" font-weight="700" text-anchor="start">ENA DX LAB（恵那市地域DX人材育成事業）案</text><text x="40" y="86" font-size="18" fill="#dbe4ff" font-weight="400" text-anchor="start">人を育てながら、市役所・暮らし・事業所の課題を解く ― 恵那で学び、働き、育つ</text><text x="1160" y="50" font-size="18" fill="#ffffff" font-weight="700" text-anchor="end">企画案 v3.1</text><text x="1160" y="80" font-size="15" fill="#dbe4ff" font-weight="400" text-anchor="end">2026年11月24日</text><rect x="40" y="128" width="240" height="320" rx="10" fill="#fdf0e6" stroke="#c2410c" stroke-width="1.5"/><text x="160" y="162" font-size="20" fill="#c2410c" font-weight="700" text-anchor="middle">課題</text><text x="60" y="206" font-size="16" fill="#1f2937" font-weight="400" text-anchor="start">若い世代が</text><text x="60" y="229" font-size="16" fill="#1f2937" font-weight="400" text-anchor="start">進学・就職で市外へ流出</text><text x="60" y="282" font-size="16" fill="#1f2937" font-weight="400" text-anchor="start">市役所にも事業所にも</text><text x="60" y="305" font-size="16" fill="#1f2937" font-weight="400" text-anchor="start">デジタルを担う人が不足</text><text x="60" y="358" font-size="16" fill="#1f2937" font-weight="400" text-anchor="start">業務の改善が</text><text x="60" y="381" font-size="16" fill="#1f2937" font-weight="400" text-anchor="start">一度きりで続かない</text><path d="M282 288H316" fill="none" stroke="#9aa3ae" stroke-width="2" marker-end="url(#a)"/><rect x="320" y="128" width="420" height="320" rx="10" fill="#e8f0fe" stroke="#2563eb" stroke-width="2"/><text x="530" y="162" font-size="20" fill="#2563eb" font-weight="700" text-anchor="middle">取り組み（令和9〜11年度）</text><rect x="336" y="180" width="388" height="78" rx="8" fill="#ffffff" stroke="#2563eb" stroke-width="1.2"/><text x="352" y="210" font-size="18" fill="#2563eb" font-weight="700" text-anchor="start">育てる</text><text x="450" y="210" font-size="15" fill="#1f2937" font-weight="400" text-anchor="start">大学生・市職員・事業者・高校生が</text><text x="450" y="234" font-size="15" fill="#1f2937" font-weight="400" text-anchor="start">デジタルで課題を解く力をつける</text><rect x="336" y="268" width="388" height="78" rx="8" fill="#ffffff" stroke="#2563eb" stroke-width="1.2"/><text x="352" y="298" font-size="18" fill="#2563eb" font-weight="700" text-anchor="start">実践する</text><text x="450" y="298" font-size="15" fill="#1f2937" font-weight="400" text-anchor="start">市役所・暮らし・事業所を実践の場に</text><text x="450" y="322" font-size="15" fill="#1f2937" font-weight="400" text-anchor="start">課題分析と改善ツールを実証する</text><rect x="336" y="356" width="388" height="78" rx="8" fill="#ffffff" stroke="#2563eb" stroke-width="1.2"/><text x="352" y="386" font-size="18" fill="#2563eb" font-weight="700" text-anchor="start">広げる</text><text x="450" y="386" font-size="15" fill="#1f2937" font-weight="400" text-anchor="start">成果発表会・オープンソース公開で</text><text x="450" y="410" font-size="15" fill="#1f2937" font-weight="400" text-anchor="start">他の課・事業所・自治体へ展開する</text><path d="M742 288H776" fill="none" stroke="#9aa3ae" stroke-width="2" marker-end="url(#a)"/><rect x="780" y="128" width="210" height="320" rx="10" fill="#e7f6ec" stroke="#15803d" stroke-width="1.5"/><text x="885" y="162" font-size="20" fill="#15803d" font-weight="700" text-anchor="middle">成果</text><text x="798" y="200" font-size="15" fill="#1f2937" font-weight="400" text-anchor="start">業務時間が減り</text><text x="798" y="222" font-size="15" fill="#1f2937" font-weight="400" text-anchor="start">住民対応が早くなる</text><text x="798" y="262" font-size="15" fill="#1f2937" font-weight="400" text-anchor="start">育った市職員が</text><text x="798" y="284" font-size="15" fill="#1f2937" font-weight="400" text-anchor="start">自ら改善を続ける</text><text x="798" y="324" font-size="15" fill="#1f2937" font-weight="400" text-anchor="start">事業所の</text><text x="798" y="346" font-size="15" fill="#1f2937" font-weight="400" text-anchor="start">デジタル活用が進む</text><text x="798" y="386" font-size="15" fill="#1f2937" font-weight="400" text-anchor="start">育った人が</text><text x="798" y="408" font-size="15" fill="#1f2937" font-weight="400" text-anchor="start">地域に残る</text><path d="M992 288H1016" fill="none" stroke="#15803d" stroke-width="2" marker-end="url(#g)"/><rect x="1020" y="128" width="140" height="320" rx="10" fill="#1e3a8a" stroke="#1e3a8a" stroke-width="1.5"/><text x="1090" y="162" font-size="18" fill="#dbe4ff" font-weight="700" text-anchor="middle">将来像</text><text x="1090" y="218" font-size="24" fill="#ffffff" font-weight="700" text-anchor="middle">恵那で</text><text x="1090" y="254" font-size="24" fill="#ffffff" font-weight="700" text-anchor="middle">学び、</text><text x="1090" y="290" font-size="24" fill="#ffffff" font-weight="700" text-anchor="middle">働き、</text><text x="1090" y="326" font-size="24" fill="#ffffff" font-weight="700" text-anchor="middle">育つ</text><text x="1090" y="384" font-size="13" fill="#dbe4ff" font-weight="400" text-anchor="middle">地域の課題を</text><text x="1090" y="403" font-size="13" fill="#dbe4ff" font-weight="400" text-anchor="middle">自分たちで</text><text x="1090" y="422" font-size="13" fill="#dbe4ff" font-weight="400" text-anchor="middle">解き続ける</text><text x="40" y="500" font-size="18" fill="#1f2937" font-weight="700" text-anchor="start">実践フィールド</text><text x="40" y="524" font-size="14" fill="#5b6472" font-weight="400" text-anchor="start">（1年目の範囲）</text><rect x="200" y="474" width="312" height="72" rx="10" fill="#ffffff" stroke="#9aa3ae" stroke-width="1.5"/><text x="218" y="503" font-size="17" fill="#1f2937" font-weight="700" text-anchor="start">① 市役所の業務</text><text x="218" y="530" font-size="14" fill="#5b6472" font-weight="400" text-anchor="start">庁内テーマ1件（AI職員FAQなど）</text><rect x="524" y="474" width="312" height="72" rx="10" fill="#ffffff" stroke="#9aa3ae" stroke-width="1.5"/><text x="542" y="503" font-size="17" fill="#1f2937" font-weight="700" text-anchor="start">② 市民の暮らし</text><text x="542" y="530" font-size="14" fill="#5b6472" font-weight="400" text-anchor="start">住民に届くテーマ1件（地域要望の管理など）</text><rect x="848" y="474" width="312" height="72" rx="10" fill="#ffffff" stroke="#9aa3ae" stroke-width="1.5"/><text x="866" y="503" font-size="17" fill="#1f2937" font-weight="700" text-anchor="start">③ 市内事業所</text><text x="866" y="530" font-size="14" fill="#5b6472" font-weight="400" text-anchor="start">相談会と業務診断（3〜5社）</text><text x="40" y="600" font-size="18" fill="#1f2937" font-weight="700" text-anchor="start">育てる相手</text><rect x="200" y="572" width="231" height="48" rx="24" fill="#e8f0fe" stroke="#e8f0fe" stroke-width="1.5"/><text x="220" y="602" font-size="16" fill="#2563eb" font-weight="700" text-anchor="start">大学生</text><text x="280" y="602" font-size="14" fill="#1f2937" font-weight="400" text-anchor="start">有償インターンで実務</text><rect x="443" y="572" width="231" height="48" rx="24" fill="#e8f0fe" stroke="#e8f0fe" stroke-width="1.5"/><text x="463" y="602" font-size="16" fill="#2563eb" font-weight="700" text-anchor="start">市職員</text><text x="523" y="602" font-size="14" fill="#1f2937" font-weight="400" text-anchor="start">自分の課の業務を改善</text><rect x="686" y="572" width="231" height="48" rx="24" fill="#e8f0fe" stroke="#e8f0fe" stroke-width="1.5"/><text x="706" y="602" font-size="16" fill="#2563eb" font-weight="700" text-anchor="start">事業者</text><text x="766" y="602" font-size="14" fill="#1f2937" font-weight="400" text-anchor="start">生成AIの始め方を学ぶ</text><rect x="929" y="572" width="231" height="48" rx="24" fill="#e8f0fe" stroke="#e8f0fe" stroke-width="1.5"/><text x="949" y="602" font-size="16" fill="#2563eb" font-weight="700" text-anchor="start">高校生</text><text x="1009" y="602" font-size="14" fill="#1f2937" font-weight="400" text-anchor="start">発表会・体験で関わる</text><rect x="40" y="650" width="360" height="172" rx="10" fill="#f3f4f6" stroke="#f3f4f6" stroke-width="1.5"/><text x="60" y="686" font-size="18" fill="#1e3a8a" font-weight="700" text-anchor="start">体制</text><line x1="60" y1="700" x2="380" y2="700" stroke="#9aa3ae" stroke-width="1"/><text x="60" y="732" font-size="15" fill="#1f2937" font-weight="400" text-anchor="start">恵那市・ZEN大学・民間事業者の3者協定</text><text x="60" y="764" font-size="15" fill="#1f2937" font-weight="400" text-anchor="start">協議会が選定・評価・OSS方針を担う</text><text x="60" y="796" font-size="15" fill="#1f2937" font-weight="400" text-anchor="start">契約とお金は市から事業者へ直接</text><rect x="420" y="650" width="360" height="172" rx="10" fill="#f3f4f6" stroke="#f3f4f6" stroke-width="1.5"/><text x="440" y="686" font-size="18" fill="#1e3a8a" font-weight="700" text-anchor="start">期間と規模</text><line x1="440" y1="700" x2="760" y2="700" stroke="#9aa3ae" stroke-width="1"/><text x="440" y="732" font-size="15" fill="#1f2937" font-weight="400" text-anchor="start">令和9〜11年度（3か年度）</text><text x="440" y="764" font-size="15" fill="#1f2937" font-weight="400" text-anchor="start">事業費 年約2,800万〜3,000万円</text><text x="440" y="796" font-size="15" fill="#1f2937" font-weight="400" text-anchor="start">地域未来交付金（推進型）で国が1/2</text><rect x="800" y="650" width="360" height="172" rx="10" fill="#f3f4f6" stroke="#f3f4f6" stroke-width="1.5"/><text x="820" y="686" font-size="18" fill="#1e3a8a" font-weight="700" text-anchor="start">交付金のあとの続け方</text><line x1="820" y1="700" x2="1140" y2="700" stroke="#9aa3ae" stroke-width="1"/><text x="820" y="732" font-size="15" fill="#1f2937" font-weight="400" text-anchor="start">市の通常予算・他自治体との共同利用</text><text x="820" y="764" font-size="15" fill="#1f2937" font-weight="400" text-anchor="start">2年目に法人化を判断し受け皿に</text><text x="820" y="796" font-size="15" fill="#1f2937" font-weight="400" text-anchor="start">奨学金で若者の定着を後押し（市単独）</text></svg>